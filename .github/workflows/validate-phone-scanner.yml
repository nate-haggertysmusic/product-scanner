name: Validate Phone Scanner

on:
  pull_request:
    branches:
      - main
    paths:
      - "Supabase/index.html"
      - "Supabase/test/index.html"
      - "Supabase/validate-phone-scanner.mjs"
      - ".github/workflows/validate-phone-scanner.yml"
  push:
    branches:
      - main
    paths:
      - "Supabase/index.html"
      - "Supabase/test/index.html"
      - "Supabase/validate-phone-scanner.mjs"
      - ".github/workflows/validate-phone-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate TEST and Production scanner contracts
        run: node Supabase/validate-phone-scanner.mjs
